<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriptoribus</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/typography.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body data-page="dashboard">

  <aside id="sidebar"></aside>

  <main id="content">

    <section id="about" class="prose">
      <!-- Populated from data/site/about.html by the inline script below.
           Run `npm run build` to generate about.html from about.md. -->
      <p class="text-muted italic">Loading…</p>
    </section>

  </main>

  <script src="./js/layout.js"></script>
  <script>
    // Fetch the pre-rendered about fragment and inject it.
    // `npm run build` generates data/site/about.html from data/site/about.md.
    fetch('./data/site/about.html')
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(html => {
        document.getElementById('about').innerHTML = html;
      })
      .catch(() => {
        document.getElementById('about').innerHTML =
          '<p class="text-muted italic">About text unavailable. ' +
          'Run <code>npm run build</code> to generate it from ' +
          '<code>data/site/about.md</code>.</p>';
      });
  </script>

</body>
</html>
