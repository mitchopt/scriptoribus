<h1>About Scriptoribus</h1>
<p>Scriptoribus — <em>for the writers</em> — is a free resource hub for Latin prose composition.</p>
<p>The name was inspired by the incomparable Legentibus — <em>for the readers</em> (see the links page).</p>
